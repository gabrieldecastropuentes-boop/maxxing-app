<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0A"/>
      <stop offset="100%" style="stop-color:#1A1A1A"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF4D4D"/>
      <stop offset="100%" style="stop-color:#FF6B35"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Subtle grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Glow circles -->
  <circle cx="200" cy="315" r="200" fill="rgba(255,77,77,0.1)" filter="url(#glow)"/>
  <circle cx="1000" cy="315" r="200" fill="rgba(255,107,53,0.1)" filter="url(#glow)"/>
  
  <!-- Main text -->
  <text x="600" y="240" font-family="Arial Black, sans-serif" font-size="72" font-weight="900" fill="white" text-anchor="middle">How Attractive</text>
  <text x="600" y="340" font-family="Arial Black, sans-serif" font-size="72" font-weight="900" fill="url(#textGrad)" text-anchor="middle">Are You?</text>
  
  <!-- Subtitle -->
  <text x="600" y="420" font-family="Arial, sans-serif" font-size="28" fill="rgba(255,255,255,0.7)" text-anchor="middle">Scientific Attractiveness Analysis • Takes 2 Minutes</text>
  
  <!-- CTA hint -->
  <rect x="450" y="470" width="300" height="60" rx="30" fill="url(#textGrad)"/>
  <text x="600" y="510" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">Start Free Analysis →</text>
  
  <!-- Stats -->
  <text x="300" y="580" font-family="Arial, sans-serif" font-size="18" fill="rgba(255,255,255,0.5)" text-anchor="middle">2M+ people tested</text>
  <text x="600" y="580" font-family="Arial, sans-serif" font-size="18" fill="rgba(255,255,255,0.5)" text-anchor="middle">⭐ 4.8/5 rating</text>
  <text x="900" y="580" font-family="Arial, sans-serif" font-size="18" fill="rgba(255,255,255,0.5)" text-anchor="middle">100% Anonymous</text>
</svg>

